name: Release

# Тег из четырёх чисел (0.1.0.0) -> проверки -> релиз с архивом скилла.
# В фильтрах GitHub точка - обычный символ, а + значит «одна или больше цифр».
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pillow
      - run: python tools/check.py
      - name: Package
        run: |
          python tools/package.py dist
          cd dist && sha256sum lss-character.skill lss-character.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/lss-character.skill dist/lss-character.zip dist/SHA256SUMS \
            --title "Генератор листа персонажа D&D для LSS $TAG" \
            --generate-notes \
            --notes-file .github/release-notes.md
